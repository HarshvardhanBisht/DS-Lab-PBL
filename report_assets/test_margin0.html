<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@page {
    size: A4 portrait;
    margin: 0;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 10mm;
    font-family: Arial, sans-serif;
}
.page {
    width: 190mm;
    height: 277mm;
    page-break-after: always;
    border: 1.5px solid #000;
    padding: 20px;
    position: relative;
    box-sizing: border-box;
}
.footer {
    position: absolute;
    bottom: 15px;
    left: 0;
    width: 100%;
    text-align: center;
}
</style>
</head>
<body>
<div class="page">
    <h1>Page 1 with margin 0</h1>
    <div class="footer">1</div>
</div>
</body>
</html>
